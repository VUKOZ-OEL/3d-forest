<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D Forest</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/client.js"></script>
  </head>
  <body>
    <div id="application">
      <div id="workspace">
        <aside id="sidebar">
          <nav id="categories" role="tablist" aria-label="Tool categories"></nav>
          <button id="account-button" type="button" aria-label="Account" aria-haspopup="dialog" aria-expanded="false">
            <img alt="" aria-hidden="true" />
            <span id="account-status" aria-hidden="true"></span>
          </button>
          <div id="category-content">
            <h1 id="category-title"></h1>
            <input
              id="tool-search"
              hidden
              type="search"
              placeholder="Find tool..."
              aria-label="Find tool in current category"
            />
            <nav id="controls" aria-label="Navigation"></nav>
          </div>
        </aside>
        <div id="sidebar-handle" class="app-splitter"></div>
        <main id="main">
          <section id="viewer" aria-label="3D viewport"></section>
          <div id="bottom-handle" class="app-splitter horizontal"></div>
          <section id="bottom" aria-label="Results"></section>
        </main>
      </div>
    </div>
    <div id="connection">
      <a id="service-link" hidden target="_blank" rel="noopener noreferrer"></a>
      <span id="status" role="status">Connecting…</span
      ><button id="new-session" hidden>New session</button>
    </div>
    <div id="modal-shade" hidden></div>
    <div id="dialogs"></div>
    <div id="account-shade" hidden>
      <form id="account-dialog" role="dialog" aria-modal="true" aria-labelledby="account-title">
        <h2 id="account-title">Account sign in</h2>
        <label for="account-username">User name</label>
        <input id="account-username" autocomplete="username" maxlength="64" required />
        <label for="account-password">Password</label>
        <input id="account-password" type="password" autocomplete="current-password" required />
        <p id="account-message" role="status"></p>
        <div class="account-actions">
          <button id="account-logout" type="button" hidden>Sign out</button>
          <span></span>
          <button id="account-cancel" type="button">Cancel</button>
          <button id="account-submit" type="submit">Sign in</button>
        </div>
      </form>
    </div>
  </body>
</html>
